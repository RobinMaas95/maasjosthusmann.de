name: Deploy dev slot

on:
  push:
    branches: [alpha, beta, gamma]
  workflow_dispatch:
    inputs:
      slot:
        description: Dev slot to deploy to
        required: true
        type: choice
        options: [alpha, beta, gamma]
      tag:
        description: Existing image tag to deploy (e.g. v3.1.0). Empty = build from source of the selected branch.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      SLOT: ${{ inputs.slot || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.tag == '' }}

      - uses: docker/setup-buildx-action@v4

      - name: Resolve lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: ${{ inputs.tag == '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.SLOT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag existing image
        if: ${{ inputs.tag != '' }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${SLOT}" \
            "${IMAGE_NAME}:${{ inputs.tag }}"

      - name: Resolve application ID for slot
        env:
          ID_ALPHA: ${{ secrets.DOKPLOY_APPLICATION_ID_ALPHA }}
          ID_BETA: ${{ secrets.DOKPLOY_APPLICATION_ID_BETA }}
          ID_GAMMA: ${{ secrets.DOKPLOY_APPLICATION_ID_GAMMA }}
        run: |
          case "$SLOT" in
            alpha) echo "APPLICATION_ID=$ID_ALPHA" >> "$GITHUB_ENV" ;;
            beta)  echo "APPLICATION_ID=$ID_BETA"  >> "$GITHUB_ENV" ;;
            gamma) echo "APPLICATION_ID=$ID_GAMMA" >> "$GITHUB_ENV" ;;
          esac

      - name: Trigger Dokploy deployment
        if: ${{ env.APPLICATION_ID != '' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -fsSL -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -d "{\"applicationId\": \"$APPLICATION_ID\"}"
